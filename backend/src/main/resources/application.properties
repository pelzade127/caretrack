spring.application.name=caretrack
server.port=8080

# --- Persistence -----------------------------------------------------------
# File-backed H2 so data survives restarts. The path is relative to the directory
# you start the app from (normally caretrack/backend), giving backend/data/caretrack.mv.db.
# Override with the CARETRACK_DB_PATH environment variable.
# The empty password is fine for a local demo database; it is not a secret.
spring.datasource.url=jdbc:h2:file:${CARETRACK_DB_PATH:./data/caretrack}
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates/updates tables from the entity classes. Fine for a demo; a real
# system would use versioned migrations (Flyway or Liquibase).
spring.jpa.hibernate.ddl-auto=update
# Keep database work inside service transactions rather than during JSON rendering.
spring.jpa.open-in-view=false

# --- Errors ----------------------------------------------------------------
# GlobalExceptionHandler handles API errors; these settings cover anything that
# reaches Spring Boot's fallback /error page so it never shows internals either.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# --- CareTrack -------------------------------------------------------------
caretrack.seed.enabled=true
# Comma-separated. Only used if the frontend calls the API cross-origin.
caretrack.cors.allowed-origins=http://localhost:5173

logging.level.com.caretrack=INFO
