# Used by tests annotated with @ActiveProfiles("test").
# In-memory database, isolated from your local data file. ${random.uuid} gives each
# Spring test context its own database, so test classes can't see each other's data.
spring.datasource.url=jdbc:h2:mem:caretrack-test-${random.uuid};DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
caretrack.seed.enabled=false
logging.level.com.caretrack=WARN
